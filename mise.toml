[tools]
go = "1.26.5"
prek = "latest"

[hooks]
postinstall = "prek install"

[tasks.help]
alias = "default"
description = "📖 Show what's available (You are looking at it 😎)"
run = """
    # mise tasks
    echo "    _______                __        ________ __           __                  _______ __ __   __        "
    echo "   |   |   |.-----.----.--|  |.----.|  |  |  |__|.-----.--|  |.-----.--.--.--.|_     _|__|  |_|  |.-----."
    echo "   |       ||  -__|   _|  _  ||   _||  |  |  |  ||     |  _  ||  _  |  |  |  |  |   | |  |   _|  ||  -__|"
    echo "   |___|___||_____|__| |_____||__|  |________|__||__|__|_____||_____|________|  |___| |__|____|__||_____|"
    echo "                                                                                                         "
    mise ls --local
    echo
    mise tasks --local
"""

[tasks.build]
description = "🔨 Build the plugin binary into bin/"
run = "go build -o bin/herdr-window-title ."

[tasks.test]
description = "🧪 Run the test suite"
run = "go test ./..."
